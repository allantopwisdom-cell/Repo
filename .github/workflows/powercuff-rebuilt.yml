name: Build audited PowerCuff RootHide 1.2.4
on:
  push:
    branches: ['rebuild/powercuff-1.2.4']
    paths: ['PowerCuff-RootHide-1.2.4-review-source.zip', '.github/workflows/powercuff-rebuilt.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: powercuff-rebuilt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      THEOS: ${{ github.workspace }}/theos-roothide
      HOMEBREW_NO_AUTO_UPDATE: 1
      SOURCE_DATE_EPOCH: 1793700000
      THEOS_REF: cfba89a53a05b4a1b822121158acc3669c20602f
      SDK_REF: 0222fd5413cf4b9af096f37b4621afa2688572f7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and extract reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          echo 'd0c13a77db46cbdea35d81453f6cb66f96043390a6a88eb038a6f7ce6808e72f  PowerCuff-RootHide-1.2.4-review-source.zip' | shasum -a 256 -c -
          unzip -q PowerCuff-RootHide-1.2.4-review-source.zip 'rebuilt-1.2.4/*'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '16.4'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: roothide/theos
          ref: ${{ env.THEOS_REF }}
          path: theos-roothide
          submodules: recursive
          persist-credentials: false
      - name: Install iOS 16.5 SDK and packaging tools
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git "$stage/sdks"
          git -C "$stage/sdks" sparse-checkout set iPhoneOS16.5.sdk
          git -C "$stage/sdks" checkout "$SDK_REF"
          mkdir -p "$THEOS/sdks"
          cp -R "$stage/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
      - name: Test, compile, sign, package and verify
        shell: bash
        run: |
          set -euo pipefail
          cd rebuilt-1.2.4
          sh build.sh 2>&1 | tee BUILD-LOG.txt
          cp BUILD-LOG.txt README-CN.md FIXES-CN.md STATUS-CN.md SOURCE-SHA256.json packages/
          git rev-parse HEAD > packages/SOURCE_COMMIT
          (xcodebuild -version; clang --version; python3 --version) > packages/BUILD_ENVIRONMENT.txt
          printf 'THEOS=%s\nSDK=%s\n' "$THEOS_REF" "$SDK_REF" > packages/TOOLCHAIN_REFS
          (cd packages && shasum -a 256 ./* > SHA256SUMS)
      - name: Upload DEB and build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PowerCuff-RootHide-Rebuilt-1.2.4-${{ github.sha }}
          path: rebuilt-1.2.4/packages/
          if-no-files-found: error
          retention-days: 90
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PowerCuff-1.2.4-failure-${{ github.sha }}
          path: rebuilt-1.2.4/BUILD-LOG.txt
          if-no-files-found: ignore
