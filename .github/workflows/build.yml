name: Validate and build Powercuff RootHide

on:
  pull_request:
  push:
    branches: [main, master, 'audit/**', 'fix/**', 'review/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: powercuff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide
  THEOS_REF: cfba89a53a05b4a1b822121158acc3669c20602f
  SDK_REF: 0222fd5413cf4b9af096f37b4621afa2688572f7

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.4'
      - name: Source regression checks
        run: sh scripts/check.sh 2>&1 | tee SOURCE_TESTS.txt
      - name: Checkout pinned RootHide Theos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: roothide/theos
          ref: ${{ env.THEOS_REF }}
          path: theos-roothide
          submodules: recursive
          persist-credentials: false
      - name: Install pinned iOS 16.5 SDK
        run: |
          set -euo pipefail
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          git -C "$SDK_STAGE/sdks" checkout "$SDK_REF"
          mkdir -p "$THEOS/sdks"
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Install dependencies
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
      - name: Build and verify package
        run: |
          set -euo pipefail
          sh build.sh roothide
          VERSION=$(sed -n 's/^Version: //p' control)
          count=$(find packages -name '*.deb' -type f | wc -l | tr -d ' ')
          test "$count" = 1
          PACKAGE=$(find packages -name '*.deb' -type f)
          cp SOURCE_TESTS.txt packages/SOURCE_TESTS.txt
          cp "BUILD-$VERSION.md" "RELEASE-$VERSION.md" "AUDIT-$VERSION.md" packages/
          cp scripts/verify_release.py packages/verify_release.py
          printf '%s\n' "$VERSION" > packages/VERSION
          git rev-parse HEAD > packages/SOURCE_COMMIT
          git ls-files -z | xargs -0 shasum -a 256 > packages/SOURCE_FILES.sha256
          printf 'THEOS=%s\nSDK=%s\n' "$THEOS_REF" "$SDK_REF" > packages/TOOLCHAIN_REFS
          { xcodebuild -version; clang --version; python3 --version; ldid -v 2>&1 || true; dpkg-deb --version; brew list --versions ldid dpkg xz; } > packages/BUILD_ENVIRONMENT.txt
          (cd packages && for file in ./*; do
            if [[ "$file" != ./SHA256SUMS ]]; then shasum -a 256 "$file"; fi
          done > SHA256SUMS)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF#refs/tags/}" = "v$VERSION"
          fi
      - name: Upload verified package and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Powercuff-RootHide-${{ github.sha }}
          path: packages/
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/powercuff-1.3.7'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify this run's build
        env:
          ARTIFACT_NAME: Powercuff-RootHide-${{ github.sha }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir packages
          test "$(cat packages/VERSION)" = 1.3.7
          test "$(cat packages/SOURCE_COMMIT)" = "$GITHUB_SHA"
          (cd packages && sha256sum -c SHA256SUMS)
      - name: Publish a new public test release
        run: |
          set -euo pipefail
          VERSION=$(cat packages/VERSION)
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          cp "packages/RELEASE-$VERSION.md" release-notes.md
          printf '\n源码提交：`%s`。\n\n[GitHub Actions 构建](https://github.com/%s/actions/runs/%s)。\n\n附件 SHA-256：\n\n```text\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          cat packages/SHA256SUMS >> release-notes.md
          printf '```\n' >> release-notes.md
          # Create the ref without overwriting any existing tag; release existence
          # alone does not prove a tag is absent or points to this build.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > tag-created.json
          test "$(jq -r '.object.sha' tag-created.json)" = "$GITHUB_SHA"
          # Keep the release private as a draft until EVERY attachment has been
          # uploaded and matched against this exact successful build.
          gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" --title "Powercuff v$VERSION — RootHide 公测修订版" --notes-file release-notes.md --draft --prerelease --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("expected exactly one draft release") end' > release-created.json
          RELEASE_ID=$(jq -er '.id | numbers' release-created.json)
          python3 packages/verify_release.py packages release-created.json --commit "$GITHUB_SHA" --tag "$TAG" --draft
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')" = "$GITHUB_SHA"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-published.json
          python3 packages/verify_release.py packages release-published.json --commit "$GITHUB_SHA" --tag "$TAG" --public
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')" = "$GITHUB_SHA"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,isPrerelease,assets
