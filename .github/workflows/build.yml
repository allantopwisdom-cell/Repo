name: Validate and build Powercuff RootHide

on:
  pull_request:
  push:
    branches: [main, master, 'audit/**', 'fix/**', 'review/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powercuff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide
  THEOS_REF: cfba89a53a05b4a1b822121158acc3669c20602f
  SDK_REF: 0222fd5413cf4b9af096f37b4621afa2688572f7

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source regression checks
        run: sh scripts/check.sh
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - name: Checkout pinned RootHide Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          ref: ${{ env.THEOS_REF }}
          path: theos-roothide
          submodules: recursive
          persist-credentials: false
      - name: Install pinned iOS 16.5 SDK
        run: |
          set -euo pipefail
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          git -C "$SDK_STAGE/sdks" checkout "$SDK_REF"
          mkdir -p "$THEOS/sdks"
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Install dependencies
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
      - name: Build and verify package
        run: |
          set -euo pipefail
          sh build.sh roothide
          VERSION=$(sed -n 's/^Version: //p' control)
          count=$(find packages -name '*.deb' -type f | wc -l | tr -d ' ')
          test "$count" = 1
          PACKAGE=$(find packages -name '*.deb' -type f)
          python3 scripts/normalize_package.py "$PACKAGE" --epoch "$(git log -1 --format=%ct)"
          python3 scripts/verify_package.py "$PACKAGE" --version "$VERSION" | tee packages/verification.txt
          python3 scripts/test_built_package.py "$PACKAGE" | tee -a packages/verification.txt
          (cd packages && shasum -a 256 "$(basename "$PACKAGE")" > SHA256SUMS)
          git rev-parse HEAD > packages/SOURCE_COMMIT
          printf 'THEOS=%s\nSDK=%s\n' "$THEOS_REF" "$SDK_REF" > packages/TOOLCHAIN_REFS
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF#refs/tags/}" = "v$VERSION"
          fi
      - name: Upload verified package and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Powercuff-RootHide-${{ github.sha }}
          path: packages/
          if-no-files-found: error
          retention-days: 90
